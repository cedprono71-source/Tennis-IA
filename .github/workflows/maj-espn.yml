name: Import ESPN et Elo

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python maj_espn.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
