name: maj-elo
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  elo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python maj_elo.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

